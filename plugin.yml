name: Fjall Deploy
description: Deploy, destroy, or build Fjall applications on AWS
author: https://github.com/fjall-tech
requirements:
  - npm
  - node

configuration:
  properties:
    command:
      type: string
      enum:
        - deploy
        - destroy
        - build
      default: deploy
    target:
      type: string
    service:
      type: string
      description: "One service (deploy and build only), from fjall 40 by its whole name, ignoring case. Fjall 39 also selects every service whose name ends with it"
    mode:
      type: string
      enum:
        - full
        - infra-only
        - deploy-only
      default: full
    environment:
      type: string
    deploy-target:
      type: string
    verbose:
      type: boolean
      default: false
    skip-build:
      type: boolean
      default: false
    no-cascade:
      type: boolean
      default: false
    region:
      type: string
    image-tag:
      type: string
    plan:
      type: boolean
      default: false
    require-approval:
      type: boolean
      default: false
    auto-approve:
      type: boolean
      default: false
    approval-token:
      type: string
    build-args:
      type: array
      items:
        type: string
    build-secrets:
      type: array
      items:
        type: string
    cli-version:
      type: string
      default: "39"
    working-directory:
      type: string
      default: "."
    force:
      type: boolean
      default: false
    supersede:
      type: object
      properties:
        after:
          type: string
        token-secret:
          type: string
        barriers:
          type: array
          items:
            type: string
      required:
        - after
        - token-secret
      additionalProperties: false
  required:
    - target
